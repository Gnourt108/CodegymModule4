<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tạo bảng cơ bản</title>
  <style>
    body{
      font-family: Arial, Helvetica, sans-serif;
    }
    table{
      border: 1px solid black;
      border-collapse: collapse;
    }
    td, th{
      border: 1px solid black;
      padding: 10px;
    }
    .company{
      padding-right: 100px;
    }
    tr:nth-child(odd){
      background-color: #cacaca;
    }
  </style>
</head>
<body>
  <table>
    <tr>
      <th class="company">Company</th>
      <th>Contact</th>
      <th>Country</th>
    </tr>
    <tr>
      <td class="company">Alfreds Futterkiste</td>
      <td>Maria Anders</td>
      <td>Germany</td>
    </tr>
    <tr>
      <td class="company">Centro comercial Moctezuma</td>
      <td>Francisco Chang</td>
      <td>Mexico</td>
    </tr>
    <tr>
      <td class="company">Ernst Handel</td>
      <td>Roland Mendel</td>
      <td>Austria</td>
    </tr>
    <tr>
      <td class="company">Island Trading</td>
      <td>Helen Bennett</td>
      <td>UK</td>
    </tr>
    <tr>
      <td class="company">Laughing Bacchus Winecellars</td>
      <td>Yoshi Tannamuri</td>
      <td>Canada</td>
    </tr>
    <tr>
      <td class="company">Magazzini Alimentari Riuniti</td>
      <td>Giovanni Rovelli</td>
      <td>Italy</td>
    </tr>
  </table>
</body>
</html>
